<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="designForContactMe.css">
</head>
<body>
    <h2>My Portfo<span>lio</span></h2>
    <div class="contactForm">
        <h1>Contact Me</h1>
        <form>
            <label for="name">Full Name: </label><br>
                <input type="text" name="name" placeholder="Enter your name" required/><br><br>
            <label for="email">E-mail Address: </label><br>
                <input id="email" name="email" type="email" placeholder="email@example.com" required/><br><br>
            <label for="tel">Phone Number: </label><br>
                <input type="tel" name="tel" type="tel" placeholder="+63" required/><br><br>
            <label for="tel">Message: </label><br>
                <input type="text" id="message-input" placeholder="Type a message..." required/><br>
            <button id="send-btn" type="submit" value="submit">Submit</button>
        </form>
    </div>
</body>
</html>
